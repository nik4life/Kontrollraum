name: Quote V2 build check
on:
  push:
    branches: [feature/quote-editor-v2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-quote-v2-quantity.mjs
      - run: npm install
      - run: npm run build
      - name: Commit quantity fix if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/quote-workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix quote position quantity handling"
            git push origin HEAD:feature/quote-editor-v2
          fi
