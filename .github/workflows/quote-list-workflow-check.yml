name: Quote list workflow check
on:
  push:
    branches: [feature/quote-list-workflow]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-quote-list-workflow.mjs
      - run: npm install
      - run: npm run build
      - name: Commit quote list workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/quote-workspace.tsx app/quote-editor-v2.css app/api/quotes/[id]/route.ts
          if ! git diff --cached --quiet; then
            git commit -m "Add quote stages search sorting and revision flow"
            git push origin HEAD:feature/quote-list-workflow
          fi
