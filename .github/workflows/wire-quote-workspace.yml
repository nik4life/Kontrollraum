name: Wire quote workspace
on:
  push:
    branches: [fix/wire-quote-workspace]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wire-quote-workspace.mjs
      - run: npm install
      - run: npm run build
      - name: Commit wiring if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v2-client.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Wire new quote workspace into application"
            git push origin HEAD:fix/wire-quote-workspace
          fi
