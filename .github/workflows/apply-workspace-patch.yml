name: Integrate workspace patch

on:
  push:
    paths:
      - '.github/workflows/apply-workspace-patch.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  integrate-build-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply workspace integration
        run: node scripts/apply-workspace-patch.mjs
      - name: Commit integrated UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v2-client.tsx
          git commit -m "Integrate invoice review and interactive planning workspaces"
          git push origin HEAD:main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner
        run: docker build --target runner -t ghcr.io/nik4life/kontrollraum-app:latest .
      - name: Push runner
        run: docker push ghcr.io/nik4life/kontrollraum-app:latest
      - name: Build migrator
        run: docker build --target migrator -t ghcr.io/nik4life/kontrollraum-migrate:latest .
      - name: Push migrator
        run: docker push ghcr.io/nik4life/kontrollraum-migrate:latest
