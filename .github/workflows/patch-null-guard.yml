name: Patch nullable admin data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-null-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add null guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/v1-client.tsx')
          s = p.read_text()
          old = 'async function saveRole(e:FormEvent<HTMLFormElement>){e.preventDefault();const f=new FormData(e.currentTarget);const mods=data.modules'
          new = 'async function saveRole(e:FormEvent<HTMLFormElement>){e.preventDefault();if(!data)return;const f=new FormData(e.currentTarget);const mods=data.modules'
          if old not in s:
              print('Null guard already present or source changed.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/v1-client.tsx
          git commit -m 'Fix nullable admin data in V1 client'
          git push origin main
